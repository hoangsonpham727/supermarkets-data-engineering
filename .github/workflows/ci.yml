name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (parsers + DQ rules)
        run: pytest

  validate-bundle:
    # Validates the Databricks Asset Bundle. Runs only when workspace secrets are
    # configured (so forks/PRs without secrets don't fail).
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: ${{ github.event_name == 'push' }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - name: Validate bundle
        if: ${{ env.DATABRICKS_HOST != '' }}
        run: databricks bundle validate -t dev
      # On merge to main you would additionally:  databricks bundle deploy -t dev
