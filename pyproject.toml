[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# DLT/Spark inject `spark`, `dlt`, `F` globals into the pipeline files at runtime
# (F821); silver.py also imports src.common *after* a sys.path bootstrap (E402/I001).
[tool.ruff.lint.per-file-ignores]
"src/pipelines/*.py" = ["F821", "E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
